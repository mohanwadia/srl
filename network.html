<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melbourne Bus Network Reform</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #map { width: 100%; height: 100%; }

  #route-info {
    display: none;
    position: absolute;
    bottom: 24px;
    right: 10px;
    z-index: 1000;
    background: white;
    padding: 10px 14px;
    font: 13px/1.5 sans-serif;
    color: #222;
    pointer-events: none;
  }
  #route-info.visible { display: block; }
  #route-info strong { display: block; font-size: 14px; margin-bottom: 2px; }
  #route-info span { color: #555; }
</style>
</head>
<body>
<div id="map"></div>
<div id="route-info"><strong id="ri-name"></strong><span id="ri-meta"></span></div>
<script>
const COLORS = {
  B1: '#D92B26',
  B2: '#E8720C',
  selected: '#00D4FF'
};
const WEIGHTS = { B1: 5, B2: 4 };

let selectedVis = null;   // the visible layer that is highlighted
let selectedHit = null;   // the hit layer that was clicked

const info    = document.getElementById('route-info');
const riName  = document.getElementById('ri-name');
const riMeta  = document.getElementById('ri-meta');

function routeStyle(f) {
  return {
    color: f.properties.corridor === 'B1' ? COLORS.B1 : COLORS.B2,
    weight: f.properties.corridor === 'B1' ? WEIGHTS.B1 : WEIGHTS.B2,
    opacity: 0.9
  };
}

function calcKm(feature) {
  const coords = feature.geometry.coordinates;
  let d = 0;
  for (let i = 1; i < coords.length; i++) {
    d += L.latLng(coords[i-1][1], coords[i-1][0])
          .distanceTo(L.latLng(coords[i][1], coords[i][0]));
  }
  return (d / 1000).toFixed(1);
}

function showInfo(feature) {
  const p = feature.properties;
  riName.textContent = p.route || '(unnamed)';
  riMeta.textContent = p.corridor + ' | ' + calcKm(feature) + ' km';
  info.classList.add('visible');
}

function hideInfo() {
  info.classList.remove('visible');
}

function deselect() {
  if (selectedVis) {
    selectedVis.setStyle(routeStyle(selectedVis.feature));
    selectedVis = null;
    selectedHit = null;
  }
  hideInfo();
}

const map = L.map('map', { zoomControl: true });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

fetch('data/gis.geojson')
  .then(r => r.json())
  .then(GEOJSON => {
    // Visible layer
    const visLayer = L.geoJSON(GEOJSON, {
      style: routeStyle,
      interactive: false   // clicks fall through to hit layer
    }).addTo(map);

    // Hit layer — wide + invisible, handles all clicks
    L.geoJSON(GEOJSON, {
      style: f => ({
        color: 'transparent',
        weight: 20,
        opacity: 0
      }),
      onEachFeature: (feature, hitLayer) => {
        // Find matching visible sub-layer by feature id
        hitLayer.on('click', function(e) {
          L.DomEvent.stopPropagation(e);

          if (selectedHit === this) {
            deselect();
            return;
          }

          // Deselect previous visible layer
          if (selectedVis) {
            selectedVis.setStyle(routeStyle(selectedVis.feature));
          }

          // Find matching visible layer
          let visMatch = null;
          visLayer.eachLayer(vl => {
            if (vl.feature && vl.feature.id === feature.id) visMatch = vl;
          });

          if (visMatch) {
            visMatch.setStyle({
              color: COLORS.selected,
              weight: (feature.properties.corridor === 'B1' ? WEIGHTS.B1 : WEIGHTS.B2) + 1.5,
              opacity: 1
            });
            selectedVis = visMatch;
          }

          selectedHit = this;
          showInfo(feature);
        });
      }
    }).addTo(map);

    map.fitBounds(visLayer.getBounds(), { padding: [20, 20] });
  });

map.on('click', deselect);
</script>
</body>
</html>
